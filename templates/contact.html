{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Contact Us | SafeSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container">

<a class="navbar-brand fw-bold" href="/">
🛡 SafeSphere
</a>

<div>
<a href="/" class="btn btn-light me-2">Home</a>
<a href="/about/" class="btn btn-warning me-2">About</a>
<a href="/login/" class="btn btn-danger">Login</a>
</div>

</div>
</nav>

<div class="container mt-5">

<div class="card shadow-lg p-5">

<h2 class="text-center text-primary mb-4">
📞 Contact Us
</h2>

<form method="post">
    {% csrf_token %}
<div class="mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Message</label>
<textarea class="manage" rows="5" required></textarea>
</div>
{% if success %}
<div class="alert alert-success">
    {{ success }}
</div>
{% endif %}
<button class="btn btn-primary w-100">
Send Message
</button>

</form>

</div>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
© 2026 SafeSphere
</footer>

</body>
</html>
