{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Safety Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7ff;
        }

        .chat-card {
            max-width: 700px;
            margin: 50px auto;
            border-radius: 20px;
        }

        .user-box {
            background: #0d6efd;
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .ai-box {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }

        textarea {
            border-radius: 15px !important;
        }
    </style>

</head>


<body>


<div class="container">

<div class="card shadow p-4 chat-card">

<h2 class="text-center text-primary">
🤖 AI Safety Assistant
</h2>

<p class="text-center text-muted">
Your personal emergency safety guide
</p>


<form method="POST">

{% csrf_token %}


<textarea 
class="form-control"
rows="4"
name="question"
placeholder="Ask your safety question..."
required></textarea>


<button class="btn btn-primary w-100 mt-3">
Ask Assistant 🚀
</button>


</form>



{% if answer %}

<div class="ai-box">

<h5>
🤖 AI Response:
</h5>

<p>
{{ answer }}
</p>

</div>

{% endif %}



</div>

</div>


</body>
</html>
