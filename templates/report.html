{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Report | SafeSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body style="background:#f4f7fc;">

<div class="container mt-5 mb-5">

    <div class="card shadow-lg p-4">

        <h2 class="text-center text-danger mb-4">
            🚨 Emergency Report
        </h2>

        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Your Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" id="location" name="location" class="form-control" placeholder="Enter your location" required>
            </div>

            <div class="mb-3">
                <label>Location</label>
                <input type="text" name="location" class="form-control" placeholder="Enter your location" required>
            </div>
            <div class="mb-3">
    <button type="button" class="btn btn-primary" onclick="getLocation()">
        📍 Get My Current Location
    </button>
</div>
            <!-- Google Map -->
            <div class="mb-4">
                <iframe
                    src="https://www.google.com/maps?q=23.8103,90.4125&output=embed"
                    width="100%"
                    height="300"
                    style="border:0; border-radius:10px;"
                    loading="lazy">
                </iframe>
            </div>

            <div class="mb-3">
                <label>Emergency Type</label>
                <select name="emergency_type" class="form-control">
                    <option>Accident</option>
                    <option>Fire</option>
                    <option>Medical</option>
                    <option>Crime</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Describe the emergency" required></textarea>
            </div>

            <button type="submit" class="btn btn-danger w-100">
                Submit Report
            </button>

        </form>

        <hr>

        <div class="card shadow mt-4">
            <div class="card-body">

                <h4 class="text-danger">
                    📞 Emergency Contacts
                </h4>

                <hr>

                <p>🚑 Ambulance : <strong>999</strong></p>
                <p>👮 Police : <strong>999</strong></p>
                <p>🔥 Fire Service : <strong>999</strong></p>
                <p>🚨 National Emergency : <strong>999</strong></p>

            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/dashboard/" class="btn btn-primary">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</div>
<script>
function getLocation() {

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(function(position) {

            document.getElementById("location").value =
                position.coords.latitude + ", " + position.coords.longitude;

        }, function(error) {

            alert("Location access denied. Please allow location access.");

        });

    } else {

        alert("Your browser does not support Geolocation.");

    }

}
</script>
</body>
</html>
